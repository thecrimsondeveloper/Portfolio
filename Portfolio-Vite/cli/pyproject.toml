[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-cli"
version = "0.1.0"
description = "Interactive CLI for building portfolio prototypes."
requires-python = ">=3.11"

[project.scripts]
portfolio-cli = "portfolio_cli:main"
arcade-builder-cli = "arcade_builder_cli:main"
mini-arcade-orchestrator-cli = "mini_arcade_orchestrator_cli:main"
