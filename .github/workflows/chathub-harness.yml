name: ChatHub Harness

on:
  push:
    branches:
      - development
    paths:
      - "ChatHub-Harness/ideas/**"
  workflow_dispatch:
    inputs:
      workflow:
        description: "Workflow JSON file in ChatHub-Harness/workflows"
        required: false
        default: "game-build.workflow.json"
      output_branch:
        description: "Branch to receive review output"
        required: false
        default: "ChatHub-Output"

permissions:
  contents: write

concurrency:
  group: chathub-harness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-harness:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip chathub]') }}
    runs-on: ubuntu-latest
    env:
      WORKFLOW_FILE: ${{ github.event.inputs.workflow || 'game-build.workflow.json' }}
      OUTPUT_BRANCH: ${{ github.event.inputs.output_branch || 'ChatHub-Output' }}
      ACTIVE_PROMPT: ChatHub-Harness/ideas/active.prompt.md
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_API_BASE_URL: ${{ vars.NVIDIA_API_BASE_URL }}
      NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
      NVIDIA_FREE_ENDPOINTS_ONLY: "true"
      NVIDIA_FREE_MODEL_ALLOWLIST: ${{ vars.NVIDIA_FREE_MODEL_ALLOWLIST }}
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ChatHub Harness
        run: |
          python3 ChatHub-Harness/chathub_runner.py \
            --workflow "ChatHub-Harness/workflows/${WORKFLOW_FILE}" \
            --prompt "${ACTIVE_PROMPT}" \
            --direction "ChatHub-Harness/directions/current-direction.md" \
            --out "ChatHub-Harness/outbox/latest-result.md" \
            --lessons "ChatHub-Harness/lessons/harness-lessons.md"

      - name: Prepare output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/chathub-output
          mkdir -p /tmp/chathub-output
          cp -R ChatHub-Harness/outbox/. /tmp/chathub-output/
          if [ -f /tmp/chathub-output/.chathub-noop ]; then
            echo "No active prompt found. Skipping ChatHub-Output publish."
            exit 0
          fi
          rm -rf ChatHub-Harness/outbox
          git fetch origin "${OUTPUT_BRANCH}" || true
          if git show-ref --verify --quiet "refs/remotes/origin/${OUTPUT_BRANCH}"; then
            git checkout "${OUTPUT_BRANCH}"
          else
            git checkout --orphan "${OUTPUT_BRANCH}"
            git rm -rf . || true
          fi
          rm -rf ChatHub-Harness/outbox
          mkdir -p ChatHub-Harness/outbox
          cp -R /tmp/chathub-output/. ChatHub-Harness/outbox/
          rm -f ChatHub-Harness/outbox/.chathub-noop
          touch ChatHub-Harness/outbox/.gitkeep
          touch .nojekyll
          if [ -f ChatHub-Harness/outbox/latest-game.html ]; then
            cp ChatHub-Harness/outbox/latest-game.html ChatHub-Harness/outbox/index.html
            cat > index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <meta http-equiv="refresh" content="0; url=ChatHub-Harness/outbox/latest-game.html" />
            <title>ChatHub Output</title>
            <style>
              html, body { margin: 0; height: 100%; background: #090b10; color: #eef2ff; font-family: system-ui, sans-serif; }
              main { min-height: 100%; display: grid; place-items: center; padding: 24px; text-align: center; }
              a { color: #8bd3ff; }
            </style>
          </head>
          <body>
            <main>
              <div>
                <h1>ChatHub Output</h1>
                <p>Opening the latest playable harness output…</p>
                <p><a href="ChatHub-Harness/outbox/latest-game.html">Open latest game</a></p>
              </div>
            </main>
          </body>
          </html>
          HTML
            cat > ChatHub-Harness/outbox/latest-public-link.md <<'EOF'
          # ChatHub Public Link

          - Public root: https://thecrimsondeveloper.github.io/Portfolio/
          - Direct game: https://thecrimsondeveloper.github.io/Portfolio/ChatHub-Harness/outbox/latest-game.html
          - Result: https://thecrimsondeveloper.github.io/Portfolio/ChatHub-Harness/outbox/latest-result.md
          - Links: https://thecrimsondeveloper.github.io/Portfolio/ChatHub-Harness/outbox/latest-links.md
          EOF
            if [ -f ChatHub-Harness/outbox/latest-links.md ]; then
              cat >> ChatHub-Harness/outbox/latest-links.md <<'EOF'

          ## GitHub Pages

          - Public root: https://thecrimsondeveloper.github.io/Portfolio/
          - Direct game: https://thecrimsondeveloper.github.io/Portfolio/ChatHub-Harness/outbox/latest-game.html
          EOF
            fi
          fi
          git add .nojekyll index.html ChatHub-Harness/outbox
          if git diff --cached --quiet; then
            echo "No ChatHub output changes to commit."
          else
            git commit -m "Update ChatHub Harness output [skip chathub]"
            git push origin "HEAD:${OUTPUT_BRANCH}"
          fi

      - name: Upload harness result
        uses: actions/upload-artifact@v4
        with:
          name: chathub-harness-result
          path: ChatHub-Harness/outbox
          if-no-files-found: error
