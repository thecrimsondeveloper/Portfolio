<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Drifter: Dragon Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        #score { font-size: 32px; font-weight: bold; }
        #speed { font-size: 18px; margin-top: 5px; opacity: 0.9; }
        #instructions {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 16px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            opacity: 0.8;
            pointer-events: none;
            transition: opacity 1s;
        }
        .hidden { opacity: 0 !important; }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-sizing: border-box;
        }
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 10;
        }
        h1 { font-size: 60px; margin: 0; text-transform: uppercase; letter-spacing: 5px; }
        button {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 20px;
            background: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            color: #333;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Simplex Noise for terrain generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
</head>
<body>

    <div id="ui">
        <div id="score">Rings: 0</div>
        <div id="speed">Speed: 0 km/h</div>
    </div>
    
    <div id="crosshair"></div>
    
    <div id="instructions">Mouse to Steer • Hold SPACE to Flap</div>

    <div id="start-screen">
        <h1>Sky Drifter</h1>
        <p>Take flight as a dragon.</p>
        <button id="start-btn">TAKE FLIGHT</button>
    </div>

    <div id="canvas-container"></div>

<script>
    // --- Configuration ---
    const CONFIG = {
        baseSpeed: 0.8,
        maxSpeed: 2.5,
        turnSpeed: 0.08,
        worldChunkSize: 200,
        fogDensity: 0.003,
        cameraFollowDist: 35, // Slightly further back for the larger dragon
        cameraFollowHeight: 10,
        ringSpawnRate: 0.15,
        colors: {
            skyTop: 0x0077ff,
            skyBottom: 0xffffff,
            fog: 0xd6e6ff,
            ground: 0x3a9d23,
            dragonBody: 0x2E8B57, // Sea Green
            dragonWing: 0x3CB371, // Medium Sea Green
            dragonSpikes: 0xFFD700,
            ring: 0xffd700
        }
    };

    // --- Global Variables ---
    let scene, camera, renderer;
    let bird; // Variable name kept as 'bird' for logic compatibility, but contains dragon
    let terrainChunks = [];
    let rings = [];
    let clouds = [];
    let particles = [];
    let simplex = new SimplexNoise();
    
    let gameState = {
        playing: false,
        score: 0,
        speed: CONFIG.baseSpeed,
        verticalVelocity: 0, // Added vertical velocity
        boostTimer: 0,
        time: 0,
        mouseX: 0,
        mouseY: 0,
        spacePressed: false,
        flapPhase: 0
    };

    // --- Initialization ---
    function init() {
        const container = document.getElementById('canvas-container');

        // Scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(CONFIG.colors.fog);
        scene.fog = new THREE.FogExp2(CONFIG.colors.fog, CONFIG.fogDensity);

        // Camera
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        // Renderer
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Lighting
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(100, 200, 100);
        dirLight.castShadow = true;
        dirLight.shadow.camera.top = 100;
        dirLight.shadow.camera.bottom = -100;
        dirLight.shadow.camera.left = -100;
        dirLight.shadow.camera.right = 100;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // Create Player (Dragon)
        createDragon();

        // Initial World Generation
        for (let z = 0; z < 5; z++) {
            createTerrainChunk(0, -z * CONFIG.worldChunkSize);
        }

        // Event Listeners
        window.addEventListener('resize', onWindowResize, false);
        document.addEventListener('mousemove', onMouseMove, false);
        document.addEventListener('keydown', (e) => { if(e.code === 'Space') gameState.spacePressed = true; });
        document.addEventListener('keyup', (e) => { if(e.code === 'Space') gameState.spacePressed = false; });
        document.getElementById('start-btn').addEventListener('click', startGame);

        // Animation Loop
        animate();
    }

    function startGame() {
        document.getElementById('start-screen').style.display = 'none';
        gameState.playing = true;
        
        setTimeout(() => {
            document.getElementById('instructions').classList.add('hidden');
        }, 6000);
    }

    function createDragon() {
        const dragonGroup = new THREE.Group();

        // Materials
        const bodyMat = new THREE.MeshPhongMaterial({ color: CONFIG.colors.dragonBody, flatShading: true });
        const wingMat = new THREE.MeshPhongMaterial({ color: CONFIG.colors.dragonWing, side: THREE.DoubleSide, flatShading: true });
        const spikeMat = new THREE.MeshPhongMaterial({ color: CONFIG.colors.dragonSpikes, flatShading: true });

        // --- Body ---
        const bodyGeo = new THREE.ConeGeometry(1, 6, 8);
        bodyGeo.rotateX(Math.PI / 2); // Point forward
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.castShadow = true;
        dragonGroup.add(body);

        // --- Head ---
        const headGeo = new THREE.BoxGeometry(1.2, 1.2, 2);
        const head = new THREE.Mesh(headGeo, bodyMat);
        head.position.set(0, 0.8, -3.5);
        head.castShadow = true;
        dragonGroup.add(head);

        // Eyes (Simple)
        const eyeGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
        const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
        leftEye.position.set(0.6, 1.1, -4);
        dragonGroup.add(leftEye);
        const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
        rightEye.position.set(-0.6, 1.1, -4);
        dragonGroup.add(rightEye);

        // --- Tail ---
        const tailGeo = new THREE.ConeGeometry(0.6, 5, 6);
        tailGeo.rotateX(-Math.PI / 2); // Point backward
        const tail = new THREE.Mesh(tailGeo, bodyMat);
        tail.position.set(0, 0, 3);
        tail.castShadow = true;
        dragonGroup.add(tail);

        // --- Wings ---
        // To make wings flap, we need to pivot them from the shoulder (center of body)
        // We create a geometry that extends OUT from the origin (0,0,0)
        
        const wingShape = new THREE.Shape();
        wingShape.moveTo(0, 0);
        wingShape.lineTo(4, 1);   // Wing tip front
        wingShape.lineTo(5, 0);   // Wing tip far
        wingShape.lineTo(3, -2);  // Wing back edge
        wingShape.lineTo(0, -1);  // Shoulder back
        wingShape.lineTo(0, 0);
        
        const wingGeo = new THREE.ExtrudeGeometry(wingShape, { depth: 0.1, bevelEnabled: false });
        // Rotate geometry to lay flat-ish
        wingGeo.rotateX(-Math.PI / 2);
        
        // Left Wing Container
        const leftWing = new THREE.Mesh(wingGeo, wingMat);
        leftWing.position.set(0.8, 0.5, -1); // Shoulder position
        leftWing.castShadow = true;
        
        // Right Wing Container (Mirror)
        const rightWing = new THREE.Mesh(wingGeo, wingMat);
        // We need to mirror the geometry or scale the mesh. Scaling -1 on X works for visuals.
        rightWing.scale.x = -1; 
        rightWing.position.set(-0.8, 0.5, -1); // Shoulder position
        rightWing.castShadow = true;

        // Add wings to group
        dragonGroup.add(leftWing);
        dragonGroup.add(rightWing);

        // Store references for animation
        dragonGroup.userData = { leftWing: leftWing, rightWing: rightWing };

        bird = dragonGroup;
        bird.position.set(0, 20, 0);
        bird.rotation.order = 'YXZ'; 
        scene.add(bird);
    }

    function createTerrainChunk(xOffset, zOffset) {
        // Create Ground
        const geometry = new THREE.PlaneGeometry(CONFIG.worldChunkSize, CONFIG.worldChunkSize, 32, 32);
        geometry.rotateX(-Math.PI / 2);

        const positionAttribute = geometry.attributes.position;
        const vertices = positionAttribute.array;

        // Apply noise to create hills
        for (let i = 0; i < vertices.length; i += 3) {
            const x = vertices[i] + xOffset;
            const z = vertices[i + 2] + zOffset;
            let y = simplex.noise2D(x * 0.01, z * 0.01) * 15;
            y += simplex.noise2D(x * 0.03, z * 0.03) * 5;
            
            const distFromCenter = Math.abs(x);
            if (distFromCenter < 20) {
                y *= (distFromCenter / 20); 
            }
            if (y < -10) y = -10;
            vertices[i + 1] = y;
        }

        geometry.computeVertexNormals();
        const material = new THREE.MeshLambertMaterial({ color: CONFIG.colors.ground, flatShading: true });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(xOffset, 0, zOffset);
        mesh.receiveShadow = true;
        scene.add(mesh);
        terrainChunks.push(mesh);

        spawnDecorations(mesh, xOffset, zOffset);
        spawnClouds(xOffset, zOffset);
        if (Math.random() < 1.0) spawnRing(xOffset, zOffset);
    }

    function spawnDecorations(terrainMesh, xOff, zOff) {
        const count = 20;
        const treeGeo = new THREE.ConeGeometry(2, 8, 5);
        const treeMat = new THREE.MeshLambertMaterial({ color: 0x1a4d1a });
        
        for(let i=0; i<count; i++) {
            const x = (Math.random() - 0.5) * CONFIG.worldChunkSize;
            const z = (Math.random() - 0.5) * CONFIG.worldChunkSize;
            if (Math.abs(x) < 15) continue;
            const y = getTerrainHeight(x + xOff, z + zOff);
            const tree = new THREE.Mesh(treeGeo, treeMat);
            tree.position.set(x + xOff, y + 4, z + zOff);
            tree.castShadow = true;
            tree.receiveShadow = true;
            scene.add(tree);
            terrainMesh.userData.decorations = terrainMesh.userData.decorations || [];
            terrainMesh.userData.decorations.push(tree);
        }
    }

    function spawnClouds(xOff, zOff) {
        const count = 5;
        for(let i=0; i<count; i++) {
            const x = (Math.random() - 0.5) * CONFIG.worldChunkSize;
            const z = (Math.random() - 0.5) * CONFIG.worldChunkSize;
            const y = 40 + Math.random() * 40;
            const geo = new THREE.DodecahedronGeometry(4 + Math.random() * 4);
            const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 });
            const cloud = new THREE.Mesh(geo, mat);
            cloud.position.set(x + xOff, y, z + zOff);
            cloud.scale.set(1 + Math.random(), 0.5 + Math.random() * 0.5, 1 + Math.random());
            scene.add(cloud);
            clouds.push(cloud);
        }
    }

    function spawnRing(xOff, zOff) {
        const z = zOff - (Math.random() * CONFIG.worldChunkSize);
        const x = (Math.random() - 0.5) * 60; 
        const y = 20 + (Math.random() * 30);
        const geometry = new THREE.TorusGeometry(3.5, 0.3, 8, 30);
        const material = new THREE.MeshPhongMaterial({ color: CONFIG.colors.ring, emissive: 0xaa8800, shininess: 100 });
        const ring = new THREE.Mesh(geometry, material);
        ring.position.set(x, y, z);
        ring.rotation.y = Math.PI / 2;
        const sensorGeo = new THREE.CircleGeometry(3.5, 8);
        const sensorMat = new THREE.MeshBasicMaterial({ visible: false });
        const sensor = new THREE.Mesh(sensorGeo, sensorMat);
        ring.add(sensor);
        ring.userData = { active: true, sensor: sensor };
        scene.add(ring);
        rings.push(ring);
    }

    function getTerrainHeight(x, z) {
        let y = simplex.noise2D(x * 0.01, z * 0.01) * 15;
        y += simplex.noise2D(x * 0.03, z * 0.03) * 5;
        return y > -10 ? y : -10;
    }

    function onMouseMove(event) {
        gameState.mouseX = (event.clientX / window.innerWidth) * 2 - 1;
        gameState.mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
        const ch = document.getElementById('crosshair');
        ch.style.transform = `translate(calc(-50% + ${gameState.mouseX * 20}px), calc(-50% + ${gameState.mouseY * -20}px))`;
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function updatePhysics() {
        if (!gameState.playing) return;

        gameState.time += 0.01;

        // Speed Handling
        if (gameState.boostTimer > 0) {
            gameState.boostTimer--;
            gameState.speed += (CONFIG.maxSpeed - gameState.speed) * 0.05; 
        } else {
            gameState.speed += (CONFIG.baseSpeed - gameState.speed) * 0.02; 
        }

        // --- Bird Rotation (Mouse Steering) ---
        const targetPitch = gameState.mouseY * 0.8;
        const targetYaw = -gameState.mouseX * 0.8;
        const targetRoll = -gameState.mouseX * 1.2;

        bird.rotation.x += (targetPitch - bird.rotation.x) * CONFIG.turnSpeed;
        bird.rotation.y += (targetYaw - bird.rotation.y) * CONFIG.turnSpeed;
        bird.rotation.z += (targetRoll - bird.rotation.z) * CONFIG.turnSpeed;

        // --- Flight Physics (Gravity & Lift) ---
        const GRAVITY = 0.015;
        const LIFT_POWER = 0.06;
        const TERMINAL_VELOCITY = 0.8;

        // Apply Gravity
        gameState.verticalVelocity -= GRAVITY;

        // Apply Lift if Space is pressed
        if (gameState.spacePressed) {
            gameState.verticalVelocity += LIFT_POWER;
        }

        // Air Resistance / Terminal Velocity
        gameState.verticalVelocity *= 0.98; // Drag
        gameState.verticalVelocity = Math.max(Math.min(gameState.verticalVelocity, TERMINAL_VELOCITY), -TERMINAL_VELOCITY);

        // Apply Vertical Velocity to Position
        bird.position.y += gameState.verticalVelocity;

        // --- Forward Movement ---
        // We decouple Y from the forward vector so looking up doesn't make you fly up automatically.
        // You MUST use Space to fly.
        const forward = new THREE.Vector3(0, 0, -1);
        forward.applyEuler(bird.rotation);
        forward.y = 0; // Flatten the forward vector so it only affects X/Z
        forward.normalize().multiplyScalar(gameState.speed);
        bird.position.add(forward);

        // Ground Collision
        const terrainHeight = getTerrainHeight(bird.position.x, bird.position.z);
        if (bird.position.y < terrainHeight + 2) {
             bird.position.y = terrainHeight + 2;
             gameState.verticalVelocity = 0; // Reset velocity on impact
             // Optional: Bounce slightly
             gameState.verticalVelocity = 0.2;
        }
        
        // Ceiling
        if (bird.position.y > 150) {
            bird.position.y = 150;
            gameState.verticalVelocity = 0;
        }

        // --- Flapping Animation ---
        // If Space is pressed, flap fast. If not, flap very slow (gliding breathe)
        const flapSpeed = gameState.spacePressed ? 0.4 : 0.05;
        const flapAmplitude = gameState.spacePressed ? 0.6 : 0.1;
        
        gameState.flapPhase += flapSpeed;
        
        if (bird.userData.leftWing && bird.userData.rightWing) {
            // Calculate rotation Z for wings based on sine wave
            const wingRot = Math.sin(gameState.flapPhase) * flapAmplitude;
            
            bird.userData.leftWing.rotation.z = wingRot;
            bird.userData.rightWing.rotation.z = -wingRot; // Inverted for symmetry
        }

        // --- Camera Follow ---
        const relativeOffset = new THREE.Vector3(0, CONFIG.cameraFollowHeight, CONFIG.cameraFollowDist);
        const cameraOffset = relativeOffset.applyMatrix4(bird.matrixWorld);
        camera.position.lerp(cameraOffset, 0.1);
        const lookTarget = bird.position.clone().add(forward.clone().multiplyScalar(5));
        camera.lookAt(lookTarget);

        // --- Infinite World Logic ---
        const lastChunk = terrainChunks[terrainChunks.length - 1];
        if (lastChunk.position.z > bird.position.z - (CONFIG.worldChunkSize * 3)) {
            const oldChunk = terrainChunks.shift();
            scene.remove(oldChunk);
            if(oldChunk.userData.decorations) oldChunk.userData.decorations.forEach(d => scene.remove(d));
            const newZ = lastChunk.position.z - CONFIG.worldChunkSize;
            createTerrainChunk(0, newZ);
        }

        // --- Ring Collision ---
        rings.forEach((ring, index) => {
            ring.rotation.z += 0.02;
            if (ring.userData.active) {
                const dist = bird.position.distanceTo(ring.position);
                if (dist < 5.0) { // Increased hitbox slightly for dragon
                    collectRing(ring);
                }
            }
            if (ring.position.z > bird.position.z + 50) {
                scene.remove(ring);
                rings.splice(index, 1);
            }
        });

        // --- Cleanup Clouds ---
        clouds.forEach((cloud, i) => {
            if (cloud.position.z > bird.position.z + 50) {
                scene.remove(cloud);
                clouds.splice(i, 1);
            }
        });
        
        updateParticles();
        
        document.getElementById('score').innerText = `Rings: ${gameState.score}`;
        document.getElementById('speed').innerText = `Speed: ${(gameState.speed * 100).toFixed(0)} km/h`;
    }

    function collectRing(ring) {
        ring.userData.active = false;
        ring.material.color.setHex(0x00ff00);
        ring.material.emissive.setHex(0x00ff00);
        gameState.score++;
        gameState.boostTimer = 60; 
        createExplosion(ring.position);
        const animateRing = () => {
            ring.scale.multiplyScalar(0.9);
            if(ring.scale.x > 0.1) requestAnimationFrame(animateRing);
            else scene.remove(ring);
        };
        animateRing();
    }

    function createExplosion(pos) {
        for(let i=0; i<15; i++) {
            const geo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const mat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const part = new THREE.Mesh(geo, mat);
            part.position.copy(pos);
            part.userData.velocity = new THREE.Vector3(
                (Math.random()-0.5), (Math.random()-0.5), (Math.random()-0.5)
            ).multiplyScalar(2);
            part.userData.life = 30;
            scene.add(part);
            particles.push(part);
        }
    }

    function updateParticles() {
        for(let i=particles.length-1; i>=0; i--) {
            const p = particles[i];
            p.position.add(p.userData.velocity);
            p.rotation.x += 0.1;
            p.rotation.y += 0.1;
            p.userData.life--;
            p.scale.multiplyScalar(0.9);
            if(p.userData.life <= 0) {
                scene.remove(p);
                particles.splice(i, 1);
            }
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        updatePhysics();
        renderer.render(scene, camera);
    }

    init();

</script>
</body>
</html>
