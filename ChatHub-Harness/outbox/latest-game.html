<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Relic Sprint</title><style>html,body{margin:0;height:100%;background:#070711;color:#eef2ff;font-family:system-ui;overflow:hidden}#hud{position:fixed;top:0;left:0;right:0;padding:14px 18px;background:#05070acc;border-bottom:1px solid #ffffff22;display:flex;justify-content:space-between}#game{position:fixed;inset:52px 0 0 0;background:radial-gradient(circle at 50% 20%,#9c7cff44,transparent 32%)}.thing{position:absolute;border-radius:50%;transform:translate(-50%,-50%)}#p{width:30px;height:30px;background:#f5f1ff;box-shadow:0 0 24px #f5f1ff}.spark{width:20px;height:20px;background:#7dffea;box-shadow:0 0 18px #7dffea}.bad{width:34px;height:34px;border:3px solid #ff4d7d;box-shadow:0 0 18px #ff4d7d}#panel{position:fixed;left:18px;bottom:18px;max-width:460px;background:#070a12dd;border:1px solid #ffffff22;border-radius:18px;padding:14px}button{border:0;border-radius:999px;padding:9px 14px;font-weight:900}</style></head><body><div id="hud"><b>Neon Relic Sprint</b><span id="s">Score 0 · Time 45</span></div><div id="game"><div id="p" class="thing"></div></div><div id="panel"><b>Playable ChatHub output.</b><p>Move with WASD/arrows. Collect cyan relic sparks. Avoid red glitch sentries. Reach 120 points before time runs out.</p><button onclick="start()">Start / Restart</button></div><script>const g=document.getElementById('game'),p=document.getElementById('p'),s=document.getElementById('s'),panel=document.getElementById('panel');let keys={},x=innerWidth/2,y=innerHeight/2,vx=0,vy=0,score=0,time=45,run=false,last=0,items=[],bad=[];onkeydown=e=>keys[e.key.toLowerCase()]=1;onkeyup=e=>keys[e.key.toLowerCase()]=0;function R(a,b){return a+Math.random()*(b-a)}function mk(c,n){let a=[];for(let i=0;i<n;i++){let e=document.createElement('div');e.className='thing '+c;g.appendChild(e);a.push({e,x:R(40,innerWidth-40),y:R(90,innerHeight-40),vx:R(-90,90),vy:R(-90,90)})}return a}function start(){items.forEach(o=>o.e.remove());bad.forEach(o=>o.e.remove());items=mk('spark',10);bad=mk('bad',6);x=innerWidth/2;y=innerHeight/2;score=0;time=45;run=true;panel.style.display='none';last=performance.now();requestAnimationFrame(loop)}function hit(a,b,r){return Math.hypot(a.x-b.x,a.y-b.y)<r}function loop(t){if(!run)return;let dt=Math.min(.033,(t-last)/1000);last=t;time-=dt;vx=(vx+((keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0))*900*dt)*.86;vy=(vy+((keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0))*900*dt)*.86;x=Math.max(15,Math.min(innerWidth-15,x+vx*dt));y=Math.max(70,Math.min(innerHeight-15,y+vy*dt));p.style.left=x+'px';p.style.top=y+'px';for(const o of items){o.e.style.left=o.x+'px';o.e.style.top=o.y+'px';if(hit({x,y},o,26)){score+=10;o.x=R(40,innerWidth-40);o.y=R(90,innerHeight-40)}}for(const o of bad){o.x+=o.vx*dt;o.y+=o.vy*dt;if(o.x<30||o.x>innerWidth-30)o.vx*=-1;if(o.y<80||o.y>innerHeight-30)o.vy*=-1;o.e.style.left=o.x+'px';o.e.style.top=o.y+'px';if(hit({x,y},o,32)){score=Math.max(0,score-20);x=innerWidth/2;y=innerHeight/2}}s.textContent='Score '+score+' · Time '+Math.max(0,time).toFixed(1);if(score>=120||time<=0){run=false;panel.style.display='block';panel.innerHTML='<b>'+(score>=120?'Relic signal restored.':'The ruin swallowed the signal.')+'</b><p>Final score: '+score+'</p><button onclick="start()">Start / Restart</button>';return}requestAnimationFrame(loop)}</script></body></html>
